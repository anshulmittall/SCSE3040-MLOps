[project]
name = "delivery-api"
version = "1.0.0"
description = "Predicts how many minutes a food delivery will take (SCSE3040, S24CSEU1052)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn==0.52.1",
    "scikit-learn==1.9.0",
    "pandas==2.3.3",
    "joblib==1.5.3",
]

[tool.fastapi]
entrypoint = "app:app"
